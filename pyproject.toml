[project]
name = "tecnosistemi-ha"
version = "0.1.0"
description = "Home Assistant integration for Tecnosistemi Pico VMC devices"
requires-python = ">=3.12"
dependencies = [
    "awesomeversion>=24.6.0",
]  # Runtime deps declared in manifest.json; HA installs them

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "pytest-asyncio",
    "tecnosystemi-unofficial>=0.4.1",
    "pre-commit==3.7.0",
    "black==24.4.2",
    "flake8==7.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tell pytest-homeassistant-custom-component where the custom component lives
testpaths = ["tests"]

[tool.uv.sources]
tecnosystemi-unofficial = { path = "../tecnosystemi_unofficial", editable = true }
