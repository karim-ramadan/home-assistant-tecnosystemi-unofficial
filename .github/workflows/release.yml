name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Bump version
        run: uv version --bump ${{ github.event.inputs.bump }}

      - name: Get new version
        id: version
        run: echo "value=$(uv version --short)" >> $GITHUB_OUTPUT

      - name: Update manifest.json
        run: |
          jq --arg v "${{ steps.version.outputs.value }}" '.version = $v' \
            custom_components/tecnosystemi/manifest.json \
            > manifest.tmp && mv manifest.tmp \
            custom_components/tecnosystemi/manifest.json

      - name: Update lockfile
        run: uv lock

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock custom_components/tecnosystemi/manifest.json
          git commit -m "Release ${{ steps.version.outputs.value }}"
          git tag "v${{ steps.version.outputs.value }}"
          git push origin main
          git push origin "v${{ steps.version.outputs.value }}"
